# Publica la aplicación en GitHub Pages (https://), que es el requisito para
# que el navegador conceda el micrófono en la modalidad «Decir la letra».
# Solo se publica index.html: la raíz del sitio es la propia aplicación.
name: Publicar en GitHub Pages

on:
  push:
    branches: [claude/new-session-qii9a5]
    paths:
      - index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue cada vez; no se cancelan los que ya están en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar el sitio
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      # El token de Actions no puede CREAR el sitio de Pages: esa activación
      # inicial solo la puede hacer el dueño del repositorio, una única vez.
      - name: Configurar Pages
        id: configurar
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Pages todavía no está activado
        if: steps.configurar.outcome == 'failure'
        run: |
          echo "::error::Pages no está activado en este repositorio."
          echo "Actívalo una sola vez en Settings → Pages → Build and deployment"
          echo "→ Source: GitHub Actions. Después vuelve a lanzar este flujo"
          echo "(Actions → Publicar en GitHub Pages → Run workflow)."
          exit 1

      - name: Subir la aplicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v4
